services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: [mongo, redis, minio]
    volumes: ["./:/code"]

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker -l info
    env_file: [.env]
    depends_on: [mongo, redis]
    volumes: ["./:/code"]

  beat:
    build: .
    command: celery -A app.workers.celery_app.celery_app beat -l info
    env_file: [.env]
    depends_on: [redis]
    volumes: ["./:/code"]

  # Frontend production: build tĩnh + nginx (proxy /api -> api:8000).
  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  mongo_data:
  minio_data:
