<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        color: #4b5563;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        background: #e5e7eb;
        color: #111827;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #374151;
        white-space: pre-wrap;
      }
      .warn {
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <strong>Threads Tool Helper</strong>
    <label>
      API base
      <input id="apiBase" value="http://localhost:8000/api" />
    </label>
    <label>
      App token
      <input id="token" type="password" placeholder="Paste token from Radar page" />
    </label>
    <button id="openThreads" class="secondary">Open Threads search</button>
    <button id="send">Send cookies + doc_id to app</button>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
