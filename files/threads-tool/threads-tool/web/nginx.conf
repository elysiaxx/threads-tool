server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không khớp file tĩnh -> trả index.html (React Router lo phần còn lại).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api sang service backend "api" (cùng mạng docker-compose).
    # Dùng resolver DNS nội bộ của Docker (127.0.0.11) + biến upstream để nginx
    # phân giải lúc runtime, không fail khởi động nếu "api" lên sau.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
